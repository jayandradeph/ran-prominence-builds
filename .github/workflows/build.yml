name: Build RAN Prominence (port in progress)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Windows clients or mobile shared-code baseline (not a mobile game yet)
        type: choice
        options: [all, windows, mobile, android, ios]
        default: all
        required: true
permissions:
  contents: read
# Each run resolves an immutable source revision and writes unique private
# ci-<run>-<attempt>-<target> releases. Independent revisions can build together.
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve one private main revision
        id: resolve
        shell: python
        env:
          PROMINENCE_SOURCE_REPOSITORY: ${{ vars.PROMINENCE_SOURCE_REPOSITORY }}
          PROMINENCE_SOURCE_TOKEN: ${{ secrets.PROMINENCE_SOURCE_TOKEN }}
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          import json, os, re, sys, urllib.request
          try:
              repo = os.environ['PROMINENCE_SOURCE_REPOSITORY']
              token = os.environ['PROMINENCE_SOURCE_TOKEN']
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo) or not token:
                  raise ValueError('Missing configuration')
              def read(path):
                  request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                      headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                               'X-GitHub-Api-Version': '2022-11-28'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              if read('')['private'] is not True:
                  raise ValueError('Source must be private')
              commit = read('/commits/main')['sha']
              if not re.fullmatch('[a-f0-9]{40}', commit):
                  raise ValueError('Invalid commit')
              platform = os.environ['BUILD_PLATFORM']
              if platform not in ('all', 'windows', 'mobile', 'android', 'ios'):
                  raise ValueError('Invalid target')
              jobs = []
              if platform in ('all', 'windows'):
                  jobs.append({'target': 'windows', 'runner': 'windows-2022'})
              if platform in ('all', 'mobile', 'android'):
                  jobs.extend({'target': 'android-' + abi, 'runner': 'ubuntu-24.04'}
                              for abi in ('arm64-v8a', 'x86_64'))
              if platform in ('all', 'mobile', 'ios'):
                  jobs.append({'target': 'ios-arm64', 'runner': 'macos-15'})
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('commit=' + commit + '\n')
                  output.write('matrix=' + json.dumps({'include': jobs}) + '\n')
              print('Private source and selected targets verified.')
          except Exception:
              print('Preflight failed. Check private repository access and builder configuration.')
              sys.exit(1)
  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Enable long Windows checkout paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Check out the resolved private commit
        id: source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ vars.PROMINENCE_SOURCE_REPOSITORY }}
          ref: ${{ needs.plan.outputs.commit }}
          token: ${{ secrets.PROMINENCE_SOURCE_TOKEN }}
          persist-credentials: false
          show-progress: false
          path: private-source
      - name: Build with private compiler output
        shell: python
        env:
          PROMINENCE_TARGET: ${{ matrix.target }}
          PROMINENCE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          import os, pathlib, subprocess, sys
          try:
              root = pathlib.Path('private-source')
              log = root / 'source/ran/_Build/VS2022/cloud/bootstrap.log'
              log.parent.mkdir(parents=True, exist_ok=True)
              with log.open('w') as output:
                  code = subprocess.call([sys.executable, 'tools/ci/build.py', '--target', os.environ['PROMINENCE_TARGET'],
                      '--commit', os.environ['PROMINENCE_COMMIT']], cwd=root, stdout=output, stderr=subprocess.STDOUT)
              print('Selected build stage passed.' if code == 0 else 'Build failed; compiler details stay private.')
              sys.exit(code)
          except Exception:
              print('Build could not start; no private compiler output printed.')
              sys.exit(1)
      - name: Deliver logs and selected products privately
        if: ${{ always() && steps.source.outcome == 'success' }}
        shell: python
        env:
          PROMINENCE_SOURCE_REPOSITORY: ${{ vars.PROMINENCE_SOURCE_REPOSITORY }}
          PROMINENCE_SOURCE_TOKEN: ${{ secrets.PROMINENCE_SOURCE_TOKEN }}
          PROMINENCE_TARGET: ${{ matrix.target }}
          PROMINENCE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          import os, pathlib, subprocess, sys
          try:
              with (pathlib.Path(os.environ['RUNNER_TEMP']) / 'private-delivery.log').open('w') as output:
                  code = subprocess.call([sys.executable, 'tools/ci/publish-private.py'], cwd='private-source',
                      stdout=output, stderr=subprocess.STDOUT)
              print('Private delivery saved.' if code == 0 else 'Private delivery failed; inspect private releases and permissions.')
              sys.exit(code)
          except Exception:
              print('Private delivery could not start.')
              sys.exit(1)
